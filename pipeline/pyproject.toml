[project]
name = "transit-pipeline"
version = "0.1.0"
description = "Bakes playable Transit sectors from real Kepler, Gaia DR3, and NASA Exoplanet Archive data."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy==8.0.1",
    "astroquery==0.4.11",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "requests==2.34.2",
]

[project.scripts]
transit-pipeline = "transit_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits a remote service; skipped unless RUN_NETWORK_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
